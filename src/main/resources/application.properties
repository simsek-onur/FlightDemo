# DB
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5467/recon

# Hibernate
quarkus.hibernate-orm.database.generation=validate

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# Kafka
kafka.bootstrap.servers=localhost:19092
mp.messaging.incoming.flight-context.connector=smallrye-kafka
mp.messaging.incoming.flight-context.topic=flight-context
mp.messaging.incoming.flight-context.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flight-context.auto.offset.reset=earliest
mp.messaging.incoming.flight-context.group.id=flight-demo-consumer
mp.messaging.incoming.flight-context.failure-strategy=dead-letter-queue
mp.messaging.incoming.flight-context.dead-letter-queue.topic=flight-context-dead-letter
mp.messaging.incoming.flight-context.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Flight Demo API
quarkus.smallrye-openapi.info-version=1.0

# Redis client
quarkus.redis.hosts=redis://localhost:6367

# Cache
quarkus.cache.redis.flight-by-id.key-type=java.lang.String
quarkus.cache.redis.flight-by-id.value-type=flightDemo.dto.FlightDTO

# TTL
quarkus.cache.redis.flight-by-id.expire-after-write=10m